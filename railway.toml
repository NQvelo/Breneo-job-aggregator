# Railway project config (optional). Ensures correct start command if not overridden in dashboard.
# See: https://docs.railway.com/reference/config-as-code

[build]
builder = "nixpacks"

[deploy]
# Apply DB migrations before the web process starts (avoids schema/code mismatch after deploy).
releaseCommand = "python manage.py migrate --noinput"
startCommand = "gunicorn job_aggregator.wsgi --bind 0.0.0.0:$PORT --log-file - --timeout 300 --workers 1 --preload"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
