# Railway project config (optional). Ensures correct start command if not overridden in dashboard.
# See: https://docs.railway.com/reference/config-as-code

[build]
builder = "nixpacks"

[deploy]
# Release phase (may be skipped if the dashboard overrides deploy or config-as-code is ignored).
releaseCommand = "python manage.py migrate --noinput"
# Always migrate before Gunicorn so production DB matches models even when releaseCommand never runs.
startCommand = "sh -c 'python manage.py migrate --noinput && exec gunicorn job_aggregator.wsgi --bind 0.0.0.0:$PORT --log-file - --timeout 300 --workers 1 --preload'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
